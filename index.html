<style>
:root{color-scheme:light;--bg:#f1f4f9;--card:#fff;--tx:#0b2147;--mut:#586a88;--bd:#d6deea;--inp:#fff;--soft:#eaf0f9;--pri:#072652;--acc:#ff7d01}
[data-theme=dark]{color-scheme:dark;--bg:#041532;--card:#0a2250;--tx:#ecf1fb;--mut:#9fb2d3;--bd:#1f3b70;--inp:#06193d;--soft:#102b5d;--pri:#17397a}
*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);padding:16px}
.top{max-width:900px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-size:1.15rem}.brand img{width:40px;height:40px;border-radius:10px}
.tools{display:flex;gap:8px;align-items:center}
.container{max-width:900px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:768px){.container{grid-template-columns:1fr}}
.card{background:var(--card);padding:18px;border-radius:12px;border:1px solid var(--bd);box-shadow:0 4px 15px rgba(7,38,82,.06)}
.hist{grid-column:1/-1}
h2{font-size:1rem;margin:14px 0 10px;border-left:4px solid var(--acc);padding-left:8px}h2:first-child{margin-top:0}
h3{font-size:.95rem;margin:14px 0 4px}
.up{border:2px dashed var(--acc);background:var(--soft);padding:12px;text-align:center;border-radius:8px;margin-bottom:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.up input{display:none}
#ocr{font-size:.75rem;color:var(--mut);margin-top:4px;font-weight:400}
.fg{margin-bottom:10px}
label{display:block;font-size:.8rem;font-weight:600;margin-bottom:4px;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);border-radius:6px;font-size:.92rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.row{display:flex;gap:6px;margin-bottom:6px}.row .n{flex:1;min-width:0}.row .q{width:56px}.row .p{width:90px}
.sm{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:6px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:.8rem}
.rw{display:flex;flex-direction:column;align-items:center}
.receipt{background:#fff;color:#0b2147;width:100%;max-width:330px;padding:18px;border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.18);border-top:6px solid #072652}
.receipt *{font-family:'Courier New',monospace}
.c{text-align:center}
#o-logo{max-width:90px;max-height:60px;margin-bottom:6px}
.st{font-size:1.05rem;font-weight:bold;text-transform:uppercase}
.sub{font-size:.72rem;color:#586a88}
.dv{border-bottom:1px dashed #9aa8c0;margin:10px 0}
.ln{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;margin-bottom:5px}
.ln span:last-child{font-weight:bold;text-align:right;word-break:break-word}
.tot{background:#f1f5fb;border:1px solid #dde5f1;border-left:4px solid #ff7d01;padding:8px;margin:10px 0;border-radius:6px;text-align:center}
.tot small{display:block;font-size:.7rem;color:#586a88}.tot b{font-size:1.3rem;color:#072652}
#o-status{text-align:center;font-size:.8rem;font-weight:bold;letter-spacing:1px}
#qr{display:flex;justify-content:center;margin:10px 0 4px}
.ft{text-align:center;font-size:.7rem;color:#586a88;margin-top:8px}.ft i{display:block;font-size:.6rem;color:#7b8aa6;margin-top:5px}
.act{width:100%;max-width:330px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:11px;border:none;border-radius:6px;font-weight:bold;font-size:.85rem;cursor:pointer;color:#fff}
.b1{background:var(--acc);color:#072652}.b2{background:#25D366}.b3{background:var(--pri)}.b4{background:var(--soft);color:var(--tx);border:1px solid var(--bd)}
.hr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--bd);font-size:.85rem;cursor:pointer}
.hr:hover{background:var(--soft)}.hb{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:.85rem}
.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#info li{margin:0 0 8px 20px;font-size:.9rem;line-height:1.5}
#info p{font-size:.88rem;line-height:1.55;margin-top:6px}
#info details{border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px}
#info summary{cursor:pointer;font-weight:600;font-size:.9rem}
.warn{background:var(--soft);border-left:4px solid var(--acc);padding:10px;border-radius:6px;font-size:.85rem;margin-top:12px;line-height:1.5}
.upd{color:var(--mut);font-size:.78rem!important;margin-top:14px!important}
.foot{max-width:900px;margin:16px auto 0;text-align:center;font-size:.75rem;color:var(--mut)}
textarea{resize:vertical;font-size:.88rem}
pre{white-space:pre-wrap;font-size:.75rem;color:var(--mut);margin-top:6px}
#o-msg{margin-bottom:4px}
</style>
<script>try{var _t=JSON.parse(localStorage.getItem('theme'));document.documentElement.dataset.theme=_t||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>

<body>
<div class="top"><div class="brand"><img src="icon-192.png" alt=""><b>Amana</b></div>
<div class="tools"><button class="sm" id="tb" onclick="toggleTheme()">🌙</button>
<select id="lb" style="width:auto;font-weight:600" onchange="setLang(this.value)"><option value="fr">Français</option><option value="en">English</option><option value="pcm">Pidgin</option></select></div></div>
<div class="container">
<div class="card">
  <h2 data-i="ocrT"></h2>
  <div class="up" onclick="$('shot').click()"><span data-i="ocrP"></span>
    <input type="file" id="shot" accept="image/*" onchange="ocr(event)"><div id="ocr"></div></div>
  <details id="ocrTxt" hidden style="margin-bottom:10px"><summary class="sub" style="cursor:pointer" data-i="ocrText"></summary><pre id="ocrOut"></pre></details>
  <div class="fg"><label data-i="paste"></label><textarea id="smsTxt" rows="3"></textarea>
    <button class="sm" style="margin-top:6px" onclick="readTxt()" data-i="pasteBtn"></button></div>

  <h2 data-i="shop"></h2>
  <div class="fg"><label data-i="coSel"></label><select id="prof" onchange="setProf(this.value)"></select>
    <div class="hb" style="margin:6px 0 0"><button class="sm" onclick="addProf()" data-i="newCo"></button><button class="sm" onclick="delProf()" data-i="delCo"></button></div></div>
  <div class="fg"><label data-i="store"></label><input id="store" oninput="update()"></div>
  <div class="fg"><label data-i="city"></label><input id="city" oninput="update()"></div>
  <div class="fg"><label data-i="tel"></label><input id="tel" type="tel" oninput="update()"></div>
  <div class="fg"><label data-i="niu"></label><input id="niu" oninput="update()"></div>
  <div class="fg"><label data-i="logo"></label><input type="file" id="logoIn" accept="image/*" onchange="logo(event)">
    <button class="sm" style="margin-top:6px" onclick="rmLogo()" data-i="rmLogo"></button></div>

  <div class="fg"><label data-i="msg"></label><input id="msg" oninput="update()"></div>

  <h2 data-i="pay"></h2>
  <div class="fg"><label data-i="method"></label><select id="method" onchange="update()">
    <option value="mtn" data-i="mtn"></option><option value="om" data-i="om"></option>
    <option value="cash" data-i="cash"></option><option value="bank" data-i="bank"></option><option value="card" data-i="card"></option></select></div>
  <div class="fg"><label data-i="status"></label><select id="status" onchange="update()">
    <option value="ok" data-i="sOk"></option><option value="pend" data-i="sPend"></option><option value="chk" data-i="sChk"></option></select></div>
  <div class="fg"><label data-i="date"></label><input id="date" oninput="update()"></div>
  <div class="fg"><label data-i="txid"></label><input id="txid" oninput="update()"></div>
  <div class="fg"><label data-i="client"></label><input id="client" oninput="update()"></div>

  <h2 data-i="items"></h2>
  <div id="items"></div>
  <button class="sm" onclick="addRow()" data-i="add"></button>
</div>

<div class="rw">
  <div class="receipt" id="receipt">
    <div class="c"><img id="o-logo" alt="" hidden>
      <div class="st" id="o-store"></div><div class="sub" id="o-city"></div><div class="sub" id="o-contact"></div></div>
    <div class="dv"></div>
    <div class="ln"><span data-i="rNo"></span><span id="o-num"></span></div>
    <div class="ln"><span data-i="rDate"></span><span id="o-date"></span></div>
    <div class="ln"><span data-i="rMeth"></span><span id="o-meth"></span></div>
    <div class="ln" id="o-txrow"><span data-i="rTx"></span><span id="o-txid"></span></div>
    <div class="ln"><span data-i="rCli"></span><span id="o-client"></span></div>
    <div class="dv"></div>
    <div id="o-items"></div>
    <div class="tot"><small data-i="rTot"></small><b id="o-total"></b></div>
    <div id="o-status"></div>
    <div id="qr"></div>
    <div class="ft"><div id="o-msg"></div><i data-i="disc"></i></div>
  </div>
  <div class="act">
    <button class="btn b1" onclick="shareImg()" data-i="share"></button>
    <button class="btn b2" onclick="waText()">WhatsApp</button>
    <button class="btn b3" onclick="dlImg()" data-i="dl"></button>
    <button class="btn b3" onclick="dlPdf()" data-i="pdf"></button>
    <button class="btn b4" onclick="save()" data-i="save"></button>
    <button class="btn b4" onclick="newR()" data-i="newR"></button>
  </div>
</div>

<div class="card hist">
  <h2 data-i="hist"></h2>
  <div class="hb"><button class="sm" onclick="xlsx()" data-i="expX"></button><button class="sm" onclick="csv()" data-i="exp"></button><button class="sm" onclick="clr()" data-i="clr"></button></div>
  <div id="hl"></div>
</div>
<div class="card hist"><div class="tabs" id="tabs"></div><div id="info"></div></div>
</div>
<div class="foot" data-i="foot"></div>

fr:{steps:["Renseignez votre boutique (nom, ville, téléphone, NIU/RCCM, logo). Ces informations sont mémorisées sur votre appareil.","Saisissez le paiement : mode, date, client et TxID. Vous pouvez aussi importer une capture d’écran du SMS : l’OCR remplit les champs pour vous.","Ajoutez les articles (description, quantité, prix). Le total est calculé automatiquement.","Choisissez le statut du paiement, puis vérifiez l’aperçu du reçu.","Partagez l’image (WhatsApp, etc.), téléchargez-la ou enregistrez le reçu dans l’historique. Utilisez « Nouveau reçu » pour passer au suivant."],
warn:"Avant de confirmer un paiement, vérifiez-le toujours dans votre application MTN MoMo / Orange Money ou sur votre relevé. L’application ne vérifie aucun paiement.",

en:{steps:["Enter your business details (name, city, telephone, tax/trade register number, logo). They are saved on your device.","Record the payment: method, date, customer and TxID. Alternatively, upload an SMS screenshot and the OCR will populate the fields.","Add the items purchased (description, quantity, unit price). The total is computed automatically.","Select the payment status and review the receipt preview.","Share the image (e.g., via WhatsApp), download it, or save the receipt to the history. Select “New receipt” to proceed to the next one."],
warn:"Before confirming a payment, always verify it in your MTN MoMo / Orange Money application or statement. This application does not verify any payment.",
faq:[["Can I manage several businesses?","Yes. Under “Business details”, add a new business: each keeps its own name, address, tax/trade register number, logo and closing message. Switch between them using the menu."],["Does the application verify that a payment has been received?","No. It only formats the information that you enter. Always check the payment in your MoMo / OM application before issuing a receipt."],["Is the receipt an official document?","No. It is issued by the merchant and has no official MTN or Orange standing. It does not replace a standardised invoice."],["Where are my receipts stored?","Exclusively in your device’s browser; nothing is sent to a server. Clearing the browser data erases the history, so export the CSV file regularly."],["The screenshot was read incorrectly. What should I do?","OCR may misread digits. Review and correct each field, or enter everything manually."],["Can I install the application on my phone?","Yes. In your browser menu, select “Add to Home screen” or “Install app”."],["Does it work offline?","After a first online load, data entry and receipt creation are available offline. The OCR feature requires an internet connection."]],
cgu:[["Purpose","Amana is a free tool enabling merchants to produce payment receipts. Use of the application constitutes acceptance of these terms."],["Nature of the service","The application is neither a payment service nor a financial institution. It is not affiliated with MTN or Orange, and it neither verifies, executes nor guarantees any transaction."],["Permitted use","Users undertake to issue receipts only for payments actually received and to enter accurate information. Using the application to forge proof of payment, to deceive a third party, or to commit fraud is strictly prohibited."],["User responsibility","The user is solely responsible for the content of the receipts issued and for their use, as well as for compliance with applicable tax and accounting obligations."],["Personal data","Information entered (business, customers, receipts) is stored solely in the user’s browser. OCR analysis of images is performed on the device. The application loads libraries from third-party content delivery networks (CDNs)."],["Limitation of liability","The application is provided “as is”, without any warranty of accuracy or availability. The publisher cannot be held liable for data loss, OCR reading errors, or disputes arising from receipts issued."],["Amendments and governing law","These terms may be amended at any time and are governed by the laws of Cameroon."]]},
pcm:{steps:["Write di info for your shop (name, town, phone, NIU/RCCM, logo). Di app go keep am for your phone.","Write di payment: how e pay, date, customer and TxID. You fit also put screenshot of di SMS and di app go fill di boxes for you.","Add di things wey customer buy (name, how many, price). Di app go add di total by itself.","Choose di payment status, den look di receipt well.","Send di picture (WhatsApp and so on), download am or keep am for history. Press “New receipt” when you wan make anoda one."],
warn:"Before you talk say di money don enter, check am first for your MTN MoMo / Orange Money app. Dis app no di check any payment.",
faq:[["I fit manage plenty business?","Yes. For “Di shop”, add new shop: each one go keep im name, address, NIU/RCCM, logo and end message. Use di menu change from one to anoda."],["Di app di check say di money don really enter?","No. Di app only arrange di info wey you write. Always check di money for your MoMo / OM app before you give receipt."],["Dis receipt na official paper?","No. Na di seller make am, e no get official value from MTN or Orange. E no fit replace proper invoice."],["Where my receipts di stay?","Only for di browser for your phone. We no send anything go any server. If you clear di browser data, di history go loss, so export di CSV always."],["Di app read di screenshot wrong. Wetin I go do?","Di OCR fit mistake di numbers. Check every box and correct am, or write everything by hand."],["I fit put di app for my phone?","Yes. For your browser menu, press “Add to Home screen” or “Install app”."],["E di work without network?","After you don open am one time with network, you fit write and make receipt without network. Di OCR need network."]],
cgu:[["Wetin dis app be","Amana na free tool wey help sellers make payment receipts. If you use di app, e mean say you agree with dis rules."],["Wetin di app no be","Di app no be payment service and e no be bank. E no get link with MTN or Orange, and e no di check, no di do and no di guarantee any transaction."],["How you must use am","You must make receipt only for money wey don really enter and write true information. Na serious offence to use di app make fake proof of payment, deceive somebody or do fraud."],["Your own responsibility","Na you alone carry di responsibility for di receipts wey you make and how you use dem, and for your tax and accounting duty."],["Your information","Di info wey you write (shop, customers, receipts) stay only for your browser. Di OCR di read di image for your phone. Di app di load some libraries from third-party CDN networks."],["Where we no carry blame","Di app dey “as e dey”, no guarantee say e correct or e go always dey. Di owner no go carry blame for lost data, OCR mistakes or quarrel wey come from receipts you make."],["Changes and law","We fit change dis rules any time. Cameroon law dey rule dem."]]}};
let tab='usage';
function info(){const D=INFO[lang],tb=$('tabs'),b=$('info');tb.innerHTML='';b.innerHTML='';
  [['usage','tUsage'],['faq','tFaq'],['cgu','tCgu']].forEach(([k,l])=>tb.append(mk('button',{className:'tab'+(tab===k?' on':''),textContent:t(l),onclick:()=>{tab=k;info()}})));
  if(tab==='usage'){const o=mk('ol');D.steps.forEach(x=>o.append(mk('li',{textContent:x})));b.append(o,mk('div',{className:'warn',textContent:'⚠ '+D.warn}))}
  else if(tab==='faq')D.faq.forEach(([q,a])=>{const d=mk('details');d.append(mk('summary',{textContent:q}),mk('p',{textContent:a}));b.append(d)});
  else{D.cgu.forEach(([h,x],i)=>b.append(mk('h3',{textContent:`${i+1}. ${h}`}),mk('p',{textContent:x})));b.append(mk('p',{className:'upd',textContent:t('upd')}))}}
let lang=L[ls('lang')]?ls('lang'):'fr',items=[{n:'',q:1,p:0}],curN=ls('next')||1,logoData=null;
const t=k=>L[lang][k]||k;
const fmt=n=>new Intl.NumberFormat('fr-FR').format(n)+' FCFA';
const total=()=>items.reduce((s,i)=>s+(+i.q||0)*(+i.p||0),0);
const num=()=>'REC-'+String(curN).padStart(4,'0');
const stKey=s=>'s'+s[0].toUpperCase()+s.slice(1);
const COL={ok:'#2e7d32',pend:'#e65100',chk:'#c62828'},ICO={ok:'✔ ',pend:'⏳ ',chk:'⚠ '};

function nowStr(){const d=new Date();return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function setLang(v){lang=v;ls('lang',lang);applyLang()}
function applyLang(){document.documentElement.lang=lang;$('lb').value=lang;$('tb').title=t('tTheme');
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  $('ocr').textContent=t('ocrI');rows();hist();info();update()}

/* Articles */
function rows(){const b=$('items');b.innerHTML='';items.forEach((it,i)=>{
  const r=mk('div',{className:'row'});
  r.append(mk('input',{className:'n',placeholder:t('iname'),value:it.n,oninput:e=>{it.n=e.target.value;update()}}),
    mk('input',{className:'q',type:'number',min:0,placeholder:t('iqty'),value:it.q,oninput:e=>{it.q=e.target.value;update()}}),
    mk('input',{className:'p',type:'number',min:0,placeholder:t('iprice'),value:it.p||'',oninput:e=>{it.p=e.target.value;update()}}),
    mk('button',{className:'sm',textContent:'✕',onclick:()=>{items.length>1?items.splice(i,1):items[0]={n:'',q:1,p:0};rows();update()}}));
  b.append(r)})}
function addRow(){items.push({n:'',q:1,p:0});rows()}

/* Aperçu */
function update(){
  $('o-store').textContent=$('store').value||'MA BOUTIQUE';
  $('o-city').textContent=$('city').value;
  $('o-contact').textContent=[$('tel').value,$('niu').value].filter(Boolean).join(' · ');
  const mg=$('msg').value;$('o-msg').textContent=mg;$('o-msg').hidden=!mg;
  $('o-num').textContent=num();$('o-date').textContent=$('date').value||'-';
  const m=$('method').value;$('o-meth').textContent=t(m);
  $('o-txid').textContent=$('txid').value;$('o-txrow').hidden=!$('txid').value;
  $('o-client').textContent=$('client').value||'-';
  const box=$('o-items');box.innerHTML='';
  items.forEach(i=>{if(!i.n&&!+i.p)return;const l=mk('div',{className:'ln'});
    l.append(mk('span',{textContent:`${i.q||1} x ${i.n||t('paid')}`}),mk('span',{textContent:fmt((+i.q||0)*(+i.p||0))}));box.append(l)});
  $('o-total').textContent=fmt(total());
  const s=$('status').value,st=$('o-status');st.textContent=ICO[s]+t(stKey(s));st.style.color=COL[s];
  const lg=$('o-logo');lg.hidden=!logoData;if(logoData)lg.src=logoData;
  const q=$('qr');q.innerHTML='';try{new QRCode(q,{text:[num(),$('txid').value,total(),$('store').value].join('|'),width:72,height:72})}catch(e){}
  saveProf();renderProf()}

/* Logo */
function logo(e){const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{
  const k=Math.min(1,160/Math.max(img.width,img.height)),c=mk('canvas',{width:img.width*k,height:img.height*k});
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);logoData=c.toDataURL('image/png');update()};img.src=URL.createObjectURL(f)}
function rmLogo(){logoData=null;$('logoIn').value='';update()}

/* Historique */
function cur(){return{n:curN,date:$('date').value,store:$('store').value,client:$('client').value,method:$('method').value,status:$('status').value,txid:$('txid').value,items:JSON.parse(JSON.stringify(items)),total:total()}}
function save(){const h=ls('hist')||[],r=cur(),i=h.findIndex(x=>x.n===r.n);
  i>=0?h[i]=r:h.unshift(r);ls('hist',h);if(curN>=(ls('next')||1))ls('next',curN+1);hist()}
function hist(){const h=ls('hist')||[],b=$('hl');b.innerHTML='';
  if(!h.length){b.textContent=t('empty');return}
  h.forEach(r=>{const d=mk('div',{className:'hr',onclick:()=>load(r)});
    d.append(mk('span',{textContent:`REC-${String(r.n).padStart(4,'0')} · ${r.date} · ${r.client||'-'} · ${fmt(r.total)}`}),
      mk('button',{className:'sm',textContent:'✕',onclick:e=>{e.stopPropagation();ls('hist',h.filter(x=>x.n!==r.n));hist()}}));b.append(d)})}
function load(r){curN=r.n;['client','method','status','date','txid'].forEach(k=>$(k).value=r[k]);items=JSON.parse(JSON.stringify(r.items));rows();update();scrollTo(0,0)}
function newR(){if(total()>0)save();const nx=Math.max(ls('next')||1,curN+1);ls('next',nx);curN=nx;
  ['client','txid'].forEach(k=>$(k).value='');$('date').value=nowStr();$('status').value='ok';items=[{n:'',q:1,p:0}];rows();update()}
function clr(){if(confirm(t('conf'))){ls('hist',[]);hist()}}
function csv(){const h=ls('hist')||[],q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const lines=[L[lang].csvH.map(q).join(';')];
  h.forEach(r=>lines.push([`REC-${String(r.n).padStart(4,'0')}`,r.date,r.store,r.client,t(r.method),r.txid,t(stKey(r.status)),r.items.map(i=>`${i.q}x ${i.n}`).join(' + '),r.total].map(q).join(';')));
  down(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),'recus.csv')}
function down(blob,name){const a=mk('a',{href:URL.createObjectURL(blob),download:name});a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

/* Export Excel (.xlsx) : tableaux filtrables, formules, synthèse */
const XL={fr:{recus:'Reçus',art:'Articles',syn:'Synthèse',h:['N°','Date','Entreprise','Client','Mode','TxID','Statut','Articles','Total (FCFA)'],ah:['N°','Date','Client','Article','Qté','Prix unitaire','Total ligne'],title:'Amana – Synthèse des ventes',tot:'Total des reçus',conf:'Ventes confirmées',nb:'Nombre de reçus',avg:'Panier moyen',byM:'Par mode de paiement',byS:'Par statut',byB:'Par entreprise',cnt:'Nombre',amt:'Montant (FCFA)'},
en:{recus:'Receipts',art:'Items',syn:'Summary',h:['No.','Date','Business','Customer','Method','TxID','Status','Items','Total (FCFA)'],ah:['No.','Date','Customer','Item','Qty','Unit price','Line total'],title:'Amana – Sales summary',tot:'Total of receipts',conf:'Confirmed sales',nb:'Number of receipts',avg:'Average basket',byM:'By payment method',byS:'By status',byB:'By business',cnt:'Count',amt:'Amount (FCFA)'}};
const loadScript=u=>new Promise((ok,ko)=>{if(window.ExcelJS)return ok();document.head.append(mk('script',{src:u,crossOrigin:'anonymous',onload:ok,onerror:ko}))});
async function xlsx(){
  const h=ls('hist')||[];if(!h.length){alert(t('empty'));return}
  try{await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js')}catch(e){alert(t('xlErr'));return}
  const X=XL[lang]||XL.en,NAVY='FF072652',SOFT='FFEAF0F9',nf='#,##0',fill=a=>({type:'pattern',pattern:'solid',fgColor:{argb:a}});
  const rows=[...h].sort((a,b)=>a.n-b.n),id=r=>'REC-'+String(r.n).padStart(4,'0');
  const dt=v=>{const m=/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{1,2}):(\d{2})/.exec(v||'');return m?new Date(Date.UTC(+m[3],m[2]-1,+m[1],+m[4],+m[5])):(v||'')};
  const head=(ws,n)=>{const r=ws.getRow(1);r.height=24;for(let c=1;c<=n;c++){const x=r.getCell(c);x.font={bold:true,color:{argb:'FFFFFFFF'}};x.fill=fill(NAVY);x.alignment={vertical:'middle'}}};
  const wb=new ExcelJS.Workbook();wb.creator='Amana';wb.calcProperties={fullCalcOnLoad:true};
  const s3=wb.addWorksheet(X.syn,{properties:{tabColor:{argb:'FFFF7D01'}}});

  /* Feuille 1 : reçus (tableau Excel : filtres, lignes alternées, s'étend tout seul) */
  const w1=wb.addWorksheet(X.recus,{views:[{state:'frozen',ySplit:1}]});
  w1.addTable({name:'TblRecus',ref:'A1',headerRow:true,totalsRow:false,style:{theme:'TableStyleMedium2',showRowStripes:true},
    columns:X.h.map(n=>({name:n,filterButton:true})),
    rows:rows.map(r=>[id(r),dt(r.date),r.store,r.client,t(r.method),r.txid,t(stKey(r.status)),r.items.map(i=>`${i.q}x ${i.n}`).join(' + '),r.total])});
  [12,18,24,24,20,20,24,44,16].forEach((w,i)=>w1.getColumn(i+1).width=w);
  rows.forEach((_,i)=>{w1.getCell(i+2,2).numFmt='dd/mm/yyyy hh:mm';w1.getCell(i+2,9).numFmt=nf});head(w1,9);

  /* Feuille 2 : une ligne par article, total ligne = formule */
  const L2=[];rows.forEach(r=>r.items.filter(i=>i.n||+i.p).forEach(i=>L2.push([id(r),dt(r.date),r.client,i.n,+i.q||0,+i.p||0,0])));
  if(L2.length){const w2=wb.addWorksheet(X.art,{views:[{state:'frozen',ySplit:1}]});
    w2.addTable({name:'TblArticles',ref:'A1',headerRow:true,totalsRow:false,style:{theme:'TableStyleMedium2',showRowStripes:true},columns:X.ah.map(n=>({name:n,filterButton:true})),rows:L2});
    [12,18,24,32,8,16,16].forEach((w,i)=>w2.getColumn(i+1).width=w);
    L2.forEach((l,i)=>{const n=i+2;w2.getCell(n,2).numFmt='dd/mm/yyyy hh:mm';w2.getCell(n,6).numFmt=nf;
      const c=w2.getCell(n,7);c.value={formula:`E${n}*F${n}`,result:l[4]*l[5]};c.numFmt=nf});head(w2,7)}

  /* Feuille de synthèse : tout est calculé par formules sur la feuille des reçus */
  const R=`'${X.recus}'!`;
  s3.getColumn(1).width=32;s3.getColumn(2).width=16;s3.getColumn(3).width=22;
  s3.mergeCells('A1:C1');const T=s3.getCell('A1');T.value=X.title;T.font={bold:true,size:14,color:{argb:'FFFFFFFF'}};T.fill=fill(NAVY);T.alignment={vertical:'middle'};s3.getRow(1).height=30;
  [[X.tot,`SUM(${R}I:I)`,nf],[X.conf,`SUMIF(${R}G:G,"${t('sOk')}",${R}I:I)`,nf],[X.nb,`COUNTA(${R}A:A)-1`,'0'],[X.avg,'IFERROR(B3/B5,0)',nf]].forEach(([l,f,fm],i)=>{
    const a=s3.getCell(i+3,1),b=s3.getCell(i+3,2);a.value=l;a.font={bold:true};a.fill=fill(SOFT);b.value={formula:f};b.numFmt=fm;b.font={bold:true,size:12};b.alignment={horizontal:'right'}});
  let row=8;
  const block=(title,col,labels)=>{[title,X.cnt,X.amt].forEach((v,i)=>{const c=s3.getCell(row,i+1);c.value=v;c.font={bold:true,color:{argb:'FFFFFFFF'}};c.fill=fill(NAVY)});row++;
    labels.forEach(l=>{s3.getCell(row,1).value=l;s3.getCell(row,2).value={formula:`COUNTIF(${R}${col}:${col},A${row})`};
      const c=s3.getCell(row,3);c.value={formula:`SUMIF(${R}${col}:${col},A${row},${R}I:I)`};c.numFmt=nf;row++});row++};
  block(X.byM,'E',['mtn','om','cash','bank','card'].map(t));
  block(X.byS,'G',['sOk','sPend','sChk'].map(t));
  block(X.byB,'C',[...new Set(rows.map(r=>r.store).filter(Boolean))]);

  const buf=await wb.xlsx.writeBuffer();
  down(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`Amana_${new Date().toISOString().slice(0,10)}.xlsx`)}

/* Image : partage / téléchargement */
const snap=()=>html2canvas($('receipt'),{scale:2,backgroundColor:'#fff'}).then(c=>new Promise(r=>c.toBlob(r,'image/png')));
async function dlImg(){save();down(await snap(),num()+'.png')}
async function shareImg(){save();const b=await snap(),f=new File([b],num()+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:num()})}catch(e){}}
  else{down(b,num()+'.png');alert(t('noShare'))}}
function waText(){save();const l=items.filter(i=>i.n||+i.p).map(i=>`• ${i.q||1} x ${i.n||t('paid')} : ${fmt((+i.q||0)*(+i.p||0))}`).join('\n');
  const m=`*--- ${t('wa')} - ${$('store').value} ---*\n${num()} | ${$('date').value}\n👤 *${t('rCli')}* ${$('client').value}\n${l}\n💰 *${t('rTot')} :* ${fmt(total())}\n🔢 *${t('rTx')}* ${$('txid').value}\n*${$('o-status').textContent}*`;
  window.open('https://wa.me/?text='+encodeURIComponent(m),'_blank')}

/* Entreprises */
let profs=ls('profs')||[],pid=ls('pid');
function migrate(){if(!profs.length){const o=ls('shop')||{};profs=[{id:Date.now(),store:o.store||'',city:o.city||'',tel:o.tel||'',niu:o.niu||'',logo:o.logo||null,msg:'',method:o.method||'mtn'}]}
  if(!profs.find(p=>p.id===pid))pid=profs[0].id}
const P=()=>profs.find(p=>p.id===pid);
function loadProf(){const p=P();['store','city','tel','niu','msg'].forEach(k=>$(k).value=p[k]||'');logoData=p.logo||null;$('method').value=p.method||'mtn'}
function saveProf(){const p=P();if(!p)return;['store','city','tel','niu','msg'].forEach(k=>p[k]=$(k).value);p.logo=logoData;p.method=$('method').value;ls('profs',profs);ls('pid',pid)}
function renderProf(){const s=$('prof');s.innerHTML='';profs.forEach((p,i)=>s.append(mk('option',{value:p.id,textContent:p.store||`${t('company')} ${i+1}`,selected:p.id===pid})))}
function setProf(v){saveProf();pid=+v;loadProf();update()}
function addProf(){saveProf();profs.push({id:Date.now(),store:'',city:'',tel:'',niu:'',logo:null,msg:'',method:'mtn'});pid=profs[profs.length-1].id;loadProf();update()}
function delProf(){if(profs.length<2||!confirm(t('confP')))return;profs=profs.filter(p=>p.id!==pid);pid=profs[0].id;loadProf();update()}

/* PDF */
async function dlPdf(){save();const c=await html2canvas($('receipt'),{scale:2,backgroundColor:'#fff'}),w=80,h=w*c.height/c.width;
  const d=new window.jspdf.jsPDF({unit:'mm',format:[w+10,h+10]});d.addImage(c.toDataURL('image/png'),'PNG',5,5,w,h);d.save(num()+'.pdf')}

/* OCR */
async function prep(file,deg){
  const bmp=await createImageBitmap(file),r=deg%180!==0,k=Math.min(2,1800/Math.max(bmp.width,bmp.height)),w=Math.round(bmp.width*k),h=Math.round(bmp.height*k);
  const c=mk('canvas',{width:r?h:w,height:r?w:h}),x=c.getContext('2d');
  x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(bmp,-w/2,-h/2,w,h);
  const d=x.getImageData(0,0,c.width,c.height),p=d.data;
  for(let i=0;i<p.length;i+=4){const g=Math.max(0,Math.min(255,(.299*p[i]+.587*p[i+1]+.114*p[i+2]-120)*1.5+120));p[i]=p[i+1]=p[i+2]=g}
  x.putImageData(d,0,0);return c}
async function ocr(e){
  const f=e.target.files[0];if(!f)return;const s=$('ocr');let best={txt:'',sc:-1},wk;
  try{
    wk=await Tesseract.createWorker('fra+eng');
    for(const [i,deg] of [0,90,270,180].entries()){
      s.textContent=`${t('ocrW')} (${i+1}/4)`;
      const r=await wk.recognize(await prep(f,deg)),txt=r.data.text||'';
      const sc=r.data.confidence+(/XAF|FCFA|d[ée]p[ôo]t|transaction|montant|retrait/i.test(txt)?40:0);
      if(sc>best.sc)best={txt,sc};
      if(sc>=100)break}
    showOcr(best.txt)
  }catch(x){console.error(x);s.textContent=t('ocrE')}
  finally{if(wk)wk.terminate()}
  e.target.value=''}
function showOcr(txt,quiet){const n=parse(txt);
  if(!quiet){$('ocrOut').textContent=txt;$('ocrTxt').hidden=false}
  $('ocr').textContent=n?t('ocrO').replace('{n}',n):t('ocrNone')}
function readTxt(){showOcr($('smsTxt').value,true)}
function parse(x){let n=0;
  if(/orange/i.test(x)){$('method').value='om';n++}else if(/mobile\s*money|momo|mtn/i.test(x)){$('method').value='mtn';n++}
  const a=x.match(/(?:d[ée]p[ôo]t|retrait|montant|pay[ée]|re[çc]u|envoy[ée]|transf[ée]r[ée])\D{0,15}?(\d[\d\s.,]*)\s*(?:FCFA|XAF|F\b)/i)||x.match(/(\d[\d\s.,]*)\s*(?:FCFA|XAF)/i);
  if(a){const c=a[1].trim().replace(/[.,]\d{1,2}$/,'').replace(/\D/g,'');if(c&&items.length===1&&!+items[0].p){items[0].p=c;items[0].q=1;rows();n++}}
  const d=x.match(/(\d{4})-(\d{2})-(\d{2})[ T]+(\d{1,2}:\d{2})/),d2=x.match(/(\d{2})[\/.-](\d{2})[\/.-](\d{4})[ ,]+(\d{1,2}:\d{2})/);
  if(d){$('date').value=`${d[3]}/${d[2]}/${d[1]} ${d[4].padStart(5,'0')}`;n++}
  else if(d2){$('date').value=`${d2[1]}/${d2[2]}/${d2[3]} ${d2[4].padStart(5,'0')}`;n++}
  const tx=x.match(/\b(?:Trans(?:action)?\s*(?:ID|Id)?|TxId|R[ée]f(?:[ée]rence)?|ID)\b\s*[:.]?\s*((?=[A-Za-z.]*\d)[A-Za-z0-9.]{6,})/i);
  if(tx){$('txid').value=tx[1];n++}
  const c=x.match(/\bau\s+((?:[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+\s+){1,3}[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+)/)||x.match(/(?:de la part de|par)\s+([A-Za-zÀ-ÿ]+(?:\s+[A-Za-zÀ-ÿ]+){1,3})/);
  if(c){$('client').value=c[1].replace(/\s+/g,' ').trim();n++}
  update();return n}

/* Thème */
let theme=ls('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
function applyTheme(){document.documentElement.dataset.theme=theme;$('tb').textContent=theme==='dark'?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=theme==='dark'?'#041532':'#072652'}
function toggleTheme(){theme=theme==='dark'?'light':'dark';ls('theme',theme);applyTheme()}

/* Init */
migrate();loadProf();$('date').value=nowStr();
applyTheme();applyLang();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
